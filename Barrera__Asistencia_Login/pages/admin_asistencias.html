<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisión de Asistencia - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="admin_dashboard.html">Gestión Admin</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="admin_dashboard.html">Asignaturas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="admin_asistencias.html">Supervisión Asistencias</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Hola, <span id="navbarUserName">Admin</span></span>
                    <button id="btnLogout" class="btn btn-outline-light btn-sm">Salir</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">Supervisión de Asistencia</h1>
            <a href="registrar.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Registrar Asistencia</a>
        </div>

        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body row g-3">
                <div class="col-md-3">
                    <label class="form-label">Filtrar por Docente</label>
                    <select id="filtroDocente" class="form-select"><option value="">Todos los docentes</option></select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Filtrar por Fecha</label>
                    <input type="date" id="filtroFecha" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Detectar Inasistencias</label>
                    <select id="filtroEstado" class="form-select">
                        <option value="">Cualquier estado</option>
                        <option value="Ausente">Solo Ausentes (Inasistencias)</option>
                        <option value="Atraso">Solo Atrasos</option>
                        <option value="Presente">Solo Presentes</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button id="btnLimpiar" class="btn btn-secondary w-100">Limpiar Filtros</button>
                </div>
            </div>
        </div>

        <div class="table-responsive bg-white">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Docente</th>
                        <th>Fecha</th>
                        <th>Curso</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaSupervision">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin_supervision.js"></script>
</body>
</html>
