<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Docente - Arreaga Matamoros Jonathan</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="container max-w-lg">
    <div class="bg-white rounded-3xl shadow-xl p-10">
      <h2 class="text-3xl font-bold text-center mb-8">Nuevo Docente</h2>
      
      <form id="formCrear">
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-medium mb-2">Cédula</label>
            <input type="text" id="cedula" class="form-input" required>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Nombres</label>
            <input type="text" id="nombres" class="form-input" required>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Apellidos</label>
            <input type="text" id="apellidos" class="form-input" required>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Contraseña Temporal</label>
            <input type="password" id="password" class="form-input" required>
          </div>
        </div>

        <div class="flex gap-4 mt-10">
          <a href="listado-docentes.html" class="btn btn-secondary flex-1 justify-center">Cancelar</a>
          <button type="submit" class="btn btn-primary flex-1 justify-center">Guardar Docente</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/crear-docente.js"></script>
</body>
</html>
