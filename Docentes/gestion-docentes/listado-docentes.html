<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de Docentes - Arreaga Matamoros Jonathan</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold">Gestión de Docentes</h1>
        <p class="text-gray-600">Arreaga — Docentes</p>
      </div>
      <a href="crear-docente.html" class="btn btn-primary">
        <i class="fas fa-plus"></i> Nuevo Docente
      </a>
    </div>

    <input type="text" id="searchInput" 
           placeholder="Buscar por cédula o nombre..." 
           class="form-input mb-6">

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cédula</th>
          <th>Nombres</th>
          <th>Apellidos</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaDocentes"></tbody>
    </table>
  </div>

  <script src="../js/listado-docentes.js"></script>
</body>
</html>
