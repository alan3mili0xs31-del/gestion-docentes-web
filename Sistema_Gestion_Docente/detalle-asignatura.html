
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de la Asignatura - Sistema de Gestión Docente</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="navbar">
        <h1>Sistema de Gestión Docente</h1>
        <div>
            <a href="listado-asignaturas.html" class="btn btn-outline" style="color: white; border-color: #444; background: transparent; padding: 5px 12px; font-size: 0.85rem;">Volver al Listado</a>
        </div>
    </header>

    <main class="container" style="max-width: 850px;">
        
        <div class="detail-card" style="margin-top: 20px;">
            <div class="detail-header">
                Detalle de la Asignatura
            </div>
            <div class="detail-body">
                <div class="detail-row">
                    <div class="detail-label">Código:</div>
                    <div class="detail-value">INF-601</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Nombre Materia:</div>
                    <div class="detail-value">Ingeniería de Software II</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Créditos:</div>
                    <div class="detail-value">4 créditos</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Semestre:</div>
                    <div class="detail-value">Sexto Semestre</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Facultad:</div>
                    <div class="detail-value">Facultad de Ciencias Informáticas</div>
                </div>
                
                <div class="form-actions" style="padding: 15px 0;">
                    <a href="editar-asignatura.html" class="btn btn-dark">Ir a Editar</a>
                    <a href="listado-asignaturas.html" class="btn btn-outline">Regresar</a>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
