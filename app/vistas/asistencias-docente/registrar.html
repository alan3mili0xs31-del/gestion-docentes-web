<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia - Sistema de Docentes</title>
    <link rel="stylesheet" href="../../../public/css/style.css">
</head>
<body class="home-body">

    <nav class="navbar">
        <div class="nav-brand">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span>Sistema de Gestión Docente</span>
        </div>
        <div class="nav-actions">
            <span style="color: #fff; font-size: 0.9rem; opacity: 0.85;">Hola, <span id="navbarUserName" style="font-weight: 600;">Docente</span></span>
            <button id="btnLogout" class="btn-white">Salir</button>
        </div>
    </nav>

    <div class="dot-pattern top-left"></div>
    <div class="dot-pattern bottom-right"></div>

    <main class="main-container content-align-top">

        <div class="breadcrumb" style="color: var(--text-gray); font-size: 0.85rem; margin-bottom: 1rem;">
            <a href="dashboard.html" style="color: var(--text-gray); text-decoration: none;">Asistencias</a> / <span style="color: var(--c-primary-main); font-weight: 600;">Registrar Nueva</span>
        </div>

        <header class="section-header">
            <div>
                <h1 class="page-title">Registrar Asistencia</h1>
                <p class="page-subtitle">Registra una nueva asistencia en el sistema.</p>
            </div>
        </header>

        <div class="details-layout" style="grid-template-columns: 1fr; max-width: 700px; margin: 0 auto; width: 100%;">
            <div class="form-section">
                <div class="section-card">
                    <form id="formRegistrar">

                        <div class="form-group">
                            <label for="docente">Docente</label>
                            <select class="form-input" id="docente" required>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="curso">Curso / Materia</label>
                            <select class="form-input" id="curso" required>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label for="fecha">Fecha de Asistencia</label>
                                <input type="date" class="form-input" id="fecha" required>
                            </div>
                            <div class="form-group">
                                <label for="estado">Estado</label>
                                <select class="form-input" id="estado" required>
                                    <option value="Presente">Presente</option>
                                    <option value="Atraso">Atraso</option>
                                    <option value="Ausente">Ausente</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-actions-bar">
                            <a href="dashboard.html" class="btn-cancel">Cancelar</a>
                            <button type="submit" class="btn-save">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.5rem;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                                Guardar Registro
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Sistema de Gestión Docente. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
