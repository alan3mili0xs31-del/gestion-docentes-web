<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/actividad-docente/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light text-dark">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">Panel de Administración</span>
            <div>
                <a href="./listado.html" class="btn btn-outline-light btn-sm me-2">Módulo Actividades</a>
                <a href="./index.html" class="btn btn-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white pt-3 pb-3">
                        <h2 class="h5 mb-0">Crear Nuevo Usuario</h2>
                    </div>
                    <div class="card-body p-4">
                        <form id="formCrearUsuario">
                            
                            <div class="mb-3">
                                <label for="nombreUsuario" class="form-label fw-bold">Usuario</label>
                                <input type="text" class="form-control" id="nombreUsuario" placeholder="Ej: sacosta" required>
                            </div>

                            <div class="mb-3">
                                <label for="correoUsuario" class="form-label fw-bold">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correoUsuario" placeholder="correo@ug.edu.ec" required>
                            </div>

                            <div class="mb-3">
                                <label for="passwordUsuario" class="form-label fw-bold">Contraseña</label>
                                <input type="password" class="form-control" id="passwordUsuario" required>
                            </div>

                            <div class="mb-3">
                                <label for="rolUsuario" class="form-label fw-bold">Rol</label>
                                <select class="form-select" id="rolUsuario" required>
                                    <option value="" selected disabled>Seleccione un rol...</option>
                                    <option value="Admin">Administrador</option>
                                    <option value="Docente">Docente</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold d-block">Estado</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="estadoUsuario" id="estadoActivo" value="Activo" checked>
                                    <label class="form-check-label" for="estadoActivo">Activo</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="estadoUsuario" id="estadoInactivo" value="Inactivo">
                                    <label class="form-check-label" for="estadoInactivo">Inactivo</label>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark">Registrar Usuario</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0">Usuarios Registrados</h2>
                        <div class="input-group w-50">
                            <input type="text" class="form-control form-control-sm" placeholder="Buscar usuario...">
                            <button class="btn btn-outline-secondary btn-sm" type="button"><i class="bi bi-search"></i></button>
                        </div>
                    </div>
                    <div class="card-body p-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Usuario</th>
                                        <th>Correo</th>
                                        <th>Rol</th>
                                        <th>Estado</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaUsuarios">
                                    <tr>
                                        <td class="fw-bold">sacosta</td>
                                        <td>sacosta@ug.edu.ec</td>
                                        <td><span class="badge bg-secondary">Docente</span></td>
                                        <td><span class="badge bg-success">Activo</span></td>
                                        <td class="text-center">
                                            <div class="btn-group" role="group">
                                                <button type="button" class="btn btn-sm btn-outline-dark" title="Editar"><i class="bi bi-pencil"></i></button>
                                                <button type="button" class="btn btn-sm btn-outline-danger" title="Desactivar"><i class="bi bi-person-x"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold">admin_principal</td>
                                        <td>admin@sistema.com</td>
                                        <td><span class="badge bg-dark">Administrador</span></td>
                                        <td><span class="badge bg-success">Activo</span></td>
                                        <td class="text-center">
                                            <div class="btn-group" role="group">
                                                <button type="button" class="btn btn-sm btn-outline-dark" title="Editar"><i class="bi bi-pencil"></i></button>
                                                <button type="button" class="btn btn-sm btn-outline-danger" title="Desactivar" disabled><i class="bi bi-person-x"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/actividad-docente/usuarios.js"></script>
</body>
</html>
