<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Actividad - Gestión Docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/actividad-docente/styles.css">
</head>
<body class="bg-light text-dark">

    <!-- <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Sistema de Gestión Docente</span>
            <a href="listado.html" class="btn btn-outline-light btn-sm">Volver al Listado</a>
        </div>
    </nav> -->
    <header>
      <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex flex-row justify-content-between">
            <div>
              <span class="navbar-brand mb-0 h1">Sistema de Gestión Docente</span>
              <a style="text-decoration: none; color: #FFF;" href="../home.html"><i  class="bi bi-house mr-3" style="font-size: 1.5rem;"></i> Home</a>
            </div>
            <div>   
                <a href="../actividad-docente/perfil.html" class="btn btn-outline-light btn-sm me-2">Mi Perfil</a>
                <a href="../login/login.html" class="btn btn-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
      </nav>
    </header>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                        <h2 class="h4 mb-0">Registrar Nueva Actividad</h2>
                    </div>
                    <div class="card-body p-4">
                        <form id="formCrearActividad">
                            
                            <div class="mb-3">
                                <label for="categoria" class="form-label fw-bold">Categoría de la actividad</label>
                                <select class="form-select" id="categoria" required>
                                    <option value="" selected disabled>Seleccione una categoría...</option>
                                    <option value="Docencia">Docencia</option>
                                    <option value="Investigación">Investigación</option>
                                    <option value="Vinculación">Vinculación con la Sociedad</option>
                                    <option value="Gestión Académica">Gestión Académica</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="horas" class="form-label fw-bold">Horas Realizadas</label>
                                <input type="number" class="form-control" id="horas" placeholder="Ej: 40" min="1" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fechaInicio" class="form-label fw-bold">Fecha de Inicio</label>
                                    <input type="date" class="form-control" id="fechaInicio" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="fechaFin" class="form-label fw-bold">Fecha de Fin</label>
                                    <input type="date" class="form-control" id="fechaFin" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="listado.html" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-dark">Guardar Actividad</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/actividad-docente/actividades.js"></script>
</body>
</html>
