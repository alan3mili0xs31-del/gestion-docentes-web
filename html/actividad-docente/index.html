<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Docente - Gestión Académica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/actividad-docente/styles.css">
</head>
<body class="bg-dark text-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="text-center mb-4">
                    <h1 class="h3 fw-bold">Portal del Docente</h1>
                    <p class="text-secondary">Gestión de Actividades Académicas</p>
                </div>

                <div class="card shadow border-0 text-dark">
                    <div class="card-body p-4">
                        <form id="formLogin">
                            <div class="mb-3">
                                <label for="loginUsuario" class="form-label fw-bold">Usuario Institucional</label>
                                <input type="text" class="form-control" id="loginUsuario" value="sacosta" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="loginPassword" class="form-label fw-bold">Contraseña</label>
                                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark">Ingresar a mis Actividades</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'pages/actividades/listado.html';
        });
    </script>
</body>
</html>
