</head>
<body class="bg-light text-dark">

    <header>
      <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex flex-row justify-content-between">
            <div>
              <span class="navbar-brand mb-0 h1">Sistema de Gestión Docente</span>
              <a style="text-decoration: none; color: #FFF;" href="../home.html"><i  class="bi bi-house mr-3" style="font-size: 1.5rem;"></i> Home</a>
            </div>
            <div>   
                <a href="../actividad-docente/perfil.html" class="btn btn-outline-light btn-sm me-2">Mi Perfil</a>
                <a href="../login/login.html" class="btn btn-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
      </nav>
    </header>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white pt-3 pb-3">
                        <h2 class="h5 mb-0">Configuración de Mi Perfil</h2>
                    </div>
                    <div class="card-body p-4">
                        <form id="formEditarPerfil">
                            
                            <div class="mb-3">
                                <label for="perfilUsuario" class="form-label fw-bold">Usuario (No editable)</label>
                                <input type="text" class="form-control bg-light" id="perfilUsuario" value="sacosta" disabled>
                            </div>

                            <div class="mb-3">
                                <label for="perfilCorreo" class="form-label fw-bold">Correo Electrónico</label>
                                <input type="email" class="form-control" id="perfilCorreo" value="sacosta@ug.edu.ec" required>
                            </div>

                            <div class="mb-4">
                                <label for="perfilPassword" class="form-label fw-bold">Nueva Contraseña</label>
                                <input type="password" class="form-control" id="perfilPassword" placeholder="Dejar en blanco para no cambiar">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark">Actualizar Datos</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/actividad-docente/usuarios.js"></script>
