
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Asignatura - Sistema de Gestión Docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/asignatura/estilos.css">
</head>
<body>

    <header>
      <nav class="navbar navbar-dark bg-dark mb-4 d-flex justify-content-center">
        <div style="margin: 0;" class="container d-flex flex-row justify-content-between">
            <div >
              <span class="navbar-brand mb-0 h1">Sistema de Gestión Docente</span>
              <a style="text-decoration: none; color: #FFF;" href="../home.html"><i  class="bi bi-house mr-3" style="font-size: 1.5rem;"></i> Home</a>
            </div>
            <div>   
                <a href="../actividad-docente/perfil.html" class="btn btn-outline-light btn-sm me-2">Mi Perfil</a>
                <a href="../login/login.html" class="btn btn-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
      </nav>
    </header>

    <main class="container" style="max-width: 850px;">
        
        <div class="card" style="margin-top: 20px;">
            <h2 style="font-size: 1.4rem; font-weight: 600; margin-bottom: 24px;">Editar Asignatura</h2>
            
            <form>
                <div class="form-group">
                    <label for="codigo">Código de la asignatura</label>
                    <input type="text" id="codigo" class="form-control" value="INF-601" required>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre Materia</label>
                    <input type="text" id="nombre" class="form-control" value="Ingeniería de Software II" required>
                </div>

                <div class="form-group">
                    <label for="creditos">Créditos</label>
                    <input type="number" id="creditos" class="form-control" value="4" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="semestre">Semestre</label>
                        <select id="semestre" class="form-control" required>
                            <option value="1">Primer Semestre</option>
                            <option value="2">Segundo Semestre</option>
                            <option value="3">Tercer Semestre</option>
                            <option value="4">Cuarto Semestre</option>
                            <option value="5">Quinto Semestre</option>
                            <option value="6" selected>Sexto Semestre</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="facultad">Facultad</label>
                        <select id="facultad" class="form-control" required>
                            <option value="FACCI" selected>Facultad de Ciencias Informáticas</option>
                            <option value="FACI">Facultad de Ciencias Industriales</option>
                            <option value="FACE">Facultad de Ciencias Económicas</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="listado-asignaturas.html" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-dark">Actualizar Asignatura</button>
                </div>
            </form>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
