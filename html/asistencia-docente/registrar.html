<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia - Sistema de Docentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/asistencia-docente/global.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="../asistencia-docente/dashboard.html">Gestión Docentes</a>
            <div class="d-flex align-items-center ms-auto">
                <span class="text-light me-3">Hola, <span id="navbarUserName">Docente</span></span>
                <button id="btnLogout" class="btn btn-outline-light btn-sm">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white pb-0 pt-3 border-0">
                        <h2 class="h4">Registrar Nueva Asistencia</h2>
                    </div>
                    <div class="card-body">
                        <form id="formRegistrar">
                            <div class="mb-3">
                                <label for="docente" class="form-label">Docente</label>
                                <select class="form-select" id="docente" required>
                                    <option value="">Seleccione...</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="curso" class="form-label">Curso / Materia</label>
                                <select class="form-select" id="curso" required>
                                    <option value="">Seleccione...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="fecha" class="form-label">Fecha de Asistencia</label>
                                <input type="date" class="form-control" id="fecha" required>
                            </div>

                            <div class="mb-4">
                                <label for="estado" class="form-label">Estado</label>
                                <select class="form-select" id="estado" required>
                                    <option value="Presente">Presente</option>
                                    <option value="Atraso">Atraso</option>
                                    <option value="Ausente">Ausente</option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="../asistencia-docente/dashboard.html" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar Registro</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/login/dataMock.js"></script>
    <script src="../../js/asistencia-docente/asistencia.js"></script>
</body>
</html>
