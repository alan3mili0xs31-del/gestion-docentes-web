<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de Docentes - Arreaga Matamoros Jonathan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/docente/style.css">
</head>
<body>
    <header>
      <nav  class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex flex-row justify-content-between" style="padding: 0;">
            <div >
              <span class="navbar-brand mb-0 h1" style="font-size: 1.2rem;">Sistema de Gestión Docente</span>
              <a style="text-decoration: none; color: #FFF;" href="../home.html"><i class="bi bi-house mr-3" style="font-size: 1.5rem; text-decoration: none; color: #FFF;"></i> Home</a>
            </div>
            <div>   
                <a href="../actividad-docente/perfil.html" style="font-size: 1rem; padding: 4px 8px;" class="btn btn-outline-light btn-sm me-2">Mi Perfil</a>
                <a href="../login/login.html" class="btn btn-light btn-sm" style="font-size: 1rem; padding: 4px 8px;">Cerrar Sesión</a>
            </div>
        </div>
      </nav>
    </header>

  <div class="container">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold">Gestión de Docentes</h1>
        <p class="text-gray-600">Arreaga — Docentes</p>
      </div>
      <a href="crear-docente.html" class="btn btn-primary">
        <i class="fas fa-plus"></i> Nuevo Docente
      </a>
    </div>

    <input type="text" id="searchInput" 
           placeholder="Buscar por cédula o nombre..." 
           class="form-input mb-6">

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cédula</th>
          <th>Nombres</th>
          <th>Apellidos</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaDocentes"></tbody>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/docente/listado-docentes.js"></script>
</body>
</html>
