    <style>
      .module-item {
        width: 200px;
        background-color: #212129;
        height: 200px;
        border-radius: 10px;
        display: flex;
        flex-direction: column-reverse;
        justify-content: center;
        align-items: center;
        transform: scale(100%);
        transition: all ease 300ms;
      }

      .module-item:hover {
        transform: scale(103%);
        background-color: #29292F;
      }

      .module-item:active {
        transform: scale(102%);
        background-color: #313139;
      }

      .title-section h1 {
        text-align: center;
      }

      .main-container {
        display: flex;
        flex-direction: column;
        width: 75%;
        height: 75%;

      }

      .module-setion {
        display: flex;
        flex-direction: row;
        
      }
      
      .module-grid {
        display: flex;
        flex-wrap: wrap;
        color: #FFF;
        gap: 10px;        
        justify-content: center;
      }

      i {
        font-size: 5rem;
        color: #FFF;
      }

      a {
        text-decoration: none;
        color: white;
      }
    </style>
